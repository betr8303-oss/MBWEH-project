<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G45 Multi-Target Monitor Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #0b0f19; color: #fff; display: flex; overflow: hidden; }
        
        /* Sidebar Daftar Target */
        #sidebar {
            width: 340px;
            height: 100%;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h2 { font-size: 18px; color: #38bdf8; }
        .target-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .target-item {
            background: #0f172a;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .target-item:hover { border-color: #38bdf8; background: #172033; }
        .target-item.active { border-color: #38bdf8; background: #1e3a8a; }
        
        .target-details {
            flex: 1;
            cursor: pointer;
        }
        .target-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #f8fafc; }
        .target-info { font-size: 12px; color: #94a3b8; }

        /* Tombol Hapus */
        .delete-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 8px;
        }
        .delete-btn:hover { background: #dc2626; }

        /* Area Utama Pemutar Video */
        #main-content {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }
        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #ffaa00;
            font-family: monospace;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #ffaa00;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DAFTAR TARGET -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Daftar Target (Riwayat)</h2>
        </div>
        <div class="target-list" id="targetListContainer">
            <p style="padding: 15px; color: #64748b; font-size: 13px;">Menunggu target masuk...</p>
        </div>
    </div>

    <!-- AREA PEMUTAR VIDEO -->
    <div id="main-content">
        <div id="status">STATUS: PILIH TARGET DARI DAFTAR SEBELAH KIRI</div>
        <video id="player" controls autoplay playsinline></video>
    </div>

    <!-- Firebase SDK v9 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBc4gDdIRxCR6H7RGBe7ejLyI6SrIRyxo0",
            authDomain: "haij-4beb7.firebaseapp.com",
            databaseURL: "https://haij-4beb7-default-rtdb.firebaseio.com",
            projectId: "haij-4beb7",
            storageBucket: "haij-4beb7.firebasestorage.app",
            messagingSenderId: "843252587335",
            appId: "1:843252587335:android:438d0f98d2a2505c034a62"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const listContainer = document.getElementById('targetListContainer');
        const videoPlayer = document.getElementById('player');
        const statusDiv = document.getElementById('status');
        let activeTargetId = null;

        // Ambil semua data target dari Firebase secara real-time
        onValue(ref(db, 'targets'), (snapshot) => {
            const data = snapshot.val();
            listContainer.innerHTML = '';

            if (!data) {
                listContainer.innerHTML = '<p style="padding: 15px; color: #64748b; font-size: 13px;">Belum ada target yang masuk.</p>';
                videoPlayer.src = '';
                statusDiv.innerText = "STATUS: TIDAK ADA TARGET";
                return;
            }

            const sortedTargets = Object.entries(data).reverse();

            sortedTargets.forEach(([id, target], index) => {
                const dateObj = new Date(target.time);
                const timeString = dateObj.toLocaleTimeString() + ' - ' + dateObj.toLocaleDateString();

                const item = document.createElement('div');
                item.className = 'target-item';
                if (activeTargetId === id) {
                    item.classList.add('active');
                }

                item.innerHTML = `
                    <div class="target-details">
                        <div class="target-title">Target #${sortedTargets.length - index}</div>
                        <div class="target-info">Status: <b>${target.code}</b></div>
                        <div class="target-info">${timeString}</div>
                    </div>
                    <button class="delete-btn" title="Hapus Video">Hapus</button>
                `;

                // Klik bagian teks untuk memutar video
                item.querySelector('.target-details').onclick = () => {
                    document.querySelectorAll('.target-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    activeTargetId = id;
                    
                    videoPlayer.src = target.video;
                    statusDiv.innerText = `MEMUTAR: TARGET [${target.code}]`;
                    statusDiv.style.color = "#00ff00";
                    statusDiv.style.borderColor = "#00ff00";
                };

                // Klik tombol hapus untuk menghapus data dari Firebase Database
                item.querySelector('.delete-btn').onclick = async () => {
                    if (confirm('Yakin ingin menghapus video rekaman target ini?')) {
                        try {
                            await remove(ref(db, `targets/${id}`));
                            // Jika video yang sedang diputar adalah yang dihapus, reset player
                            if (activeTargetId === id) {
                                videoPlayer.src = '';
                                statusDiv.innerText = "STATUS: VIDEO DIHAPUS";
                                statusDiv.style.color = "#ffaa00";
                                statusDiv.style.borderColor = "#ffaa00";
                                activeTargetId = null;
                            }
                        } catch (err) {
                            console.error("Gagal menghapus:", err);
                            alert("Gagal menghapus data dari database.");
                        }
                    }
                };

                listContainer.appendChild(item);
            });
        });
    </script>
</body>
</html>
